<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* Responsive: the canvas fills whatever box embeds it (our /play
         iframe). Unity's matchWebGLToCanvasSize (on by default) keeps the
         render target matched to this size * devicePixelRatio, so the game
         renders at the container's true aspect ratio -- no fixed 960x600
         box, no cropping, correct ratio whether windowed or fullscreen. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #unity-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        /* Crisp pixels for the pixel-art sprites when scaled up. */
        image-rendering: pixelated;
        background: #000;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
      }
      #unity-progress-bar-empty {
        width: 200px;
        height: 12px;
        background: #2a2233;
        border-radius: 6px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #e85d75;
        transition: width 0.1s ease;
      }
      #unity-fullscreen-button {
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 34px;
        height: 34px;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.7;
        transition: opacity 0.15s ease;
      }
      #unity-fullscreen-button:hover { opacity: 1; }
      #unity-fullscreen-button::before {
        content: "⛶";
        color: #fff;
        font-size: 20px;
        line-height: 1;
      }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        color: #fff;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-fullscreen-button" title="Fullscreen"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; color:#000; padding: 10px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        // Render at CSS pixels (DPR 1) rather than the device's full pixel
        // ratio. The art is pixel-art (image-rendering: pixelated keeps it
        // crisp), so a hi-DPI render target is wasted work that can drop the
        // frame rate below 60 on Retina/4K screens.
        devicePixelRatio: 1,
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
          // In a browser, ESC always exits fullscreen and the keypress never
          // reaches Unity, so the in-game ESC pause can't fire while fullscreen.
          // Detect leaving fullscreen and tell the game to open its pause menu,
          // so ESC-in-fullscreen still pauses (it just also drops out of
          // fullscreen, which browsers don't let pages prevent).
          document.addEventListener("fullscreenchange", () => {
            if (!document.fullscreenElement) {
              try {
                unityInstance.SendMessage("WebPauseBridge", "OnExitFullscreen");
              } catch (e) { /* bridge not ready yet -- ignore */ }
            }
          });
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
